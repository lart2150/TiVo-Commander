<?xml version="1.0" encoding="UTF-8"?>
<!--
The app icon: a drive with a play symbol on its lid, redrawn as a vector from
app_icon.psd so it can be rendered sharp at any size.  render_icons.py turns
it into the launcher PNGs and the Play Store icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85888b"/>
      <stop offset="0.35" stop-color="#a4a7a9"/>
      <stop offset="0.82" stop-color="#d6d9d9"/>
      <stop offset="1" stop-color="#c3c6c7"/>
    </linearGradient>
    <radialGradient id="lidLight" cx="127" cy="168" r="112"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46484a"/>
      <stop offset="0.74" stop-color="#303132"/>
      <stop offset="0.86" stop-color="#a2a3a4"/>
      <stop offset="1" stop-color="#d0d1d2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.55" stop-color="#2d2d2d"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="panelShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9976a"/>
      <stop offset="1" stop-color="#f2834f"/>
    </linearGradient>
    <radialGradient id="led">
      <stop offset="0" stop-color="#c8ffc0"/>
      <stop offset="0.45" stop-color="#1cf53a"/>
      <stop offset="1" stop-color="#079a1a"/>
    </radialGradient>

    <path id="lidShape"
          d="M38,26 H214 Q222,26 223.6,34 L246,178 V190 H8 V178 L30.4,34 Q32,26 38,26 Z"/>
    <clipPath id="lidClip"><use href="#lidShape"/></clipPath>

    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <g id="playShape">
      <rect x="92" y="57" width="21" height="74" rx="3"/>
      <path d="M118,61 Q118,56 122.5,58.6 L173.5,89.4 Q178,92 173.5,94.6
               L122.5,125.4 Q118,128 118,123 Z"/>
    </g>
  </defs>

  <!-- Shadow under the whole drive. -->
  <ellipse cx="127" cy="231" rx="118" ry="9" fill="#000" opacity="0.5"
           filter="url(#shadow)"/>

  <!-- Lid: gradient, a soft light across its lower half, slightly darker
       sides with a reflection just inside each, which is what makes the flat
       shape read as a rounded box.  No outline: the original's edges stay
       light, the top one especially. -->
  <use href="#lidShape" fill="url(#lid)"/>
  <use href="#lidShape" fill="url(#lidLight)"/>
  <g clip-path="url(#lidClip)">
    <path d="M8,192 V178 L30.4,34 M223.6,34 L246,178 V192"
          fill="none" stroke="#3a3c3e" stroke-width="9" opacity="0.4"
          filter="url(#blur2)"/>
    <path d="M42,40 L21,178 M212,40 L233,178"
          fill="none" stroke="#fff" stroke-width="5" opacity="0.22"
          filter="url(#blur2)"/>
    <path d="M40,27 H212" stroke="#fff" stroke-opacity="0.35"
          stroke-width="1.2"/>
  </g>

  <!-- The play symbol, glowing blue on the lid. -->
  <use href="#playShape" fill="#3a6c94" stroke="#3a6c94" stroke-width="10"
       stroke-linejoin="round" filter="url(#glow)"/>
  <use href="#playShape" fill="url(#play)"/>

  <!-- Front face: dark bezel, a silver lip along its bottom, and the panel. -->
  <rect x="8" y="172" width="238" height="54" rx="11" fill="#151617"/>
  <rect x="9.5" y="173.5" width="235" height="51" rx="10" fill="url(#rim)"/>
  <rect x="16" y="178" width="222" height="40" rx="6" fill="url(#panel)"/>
  <rect x="16" y="178" width="222" height="40" rx="6" fill="url(#panelShine)"/>
  <path d="M22,178.6 H232" stroke="#000" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Power light. -->
  <circle cx="208" cy="199" r="7" fill="#1aff3a" opacity="0.35"
          filter="url(#blur2)"/>
  <circle cx="208" cy="199" r="3.4" fill="url(#led)"/>
</svg>
